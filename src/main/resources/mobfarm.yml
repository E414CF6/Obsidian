# Obsidian MobFarm Module Configuration (absorbed from MobFarmManager)

entity-spawn:
  # Check entity limits when entities spawn
  check: true
  # Prevent players without obsidian.mobfarm.build.<entity> from building Withers, Iron Golems, or Snow Golems
  prevent-mob-build: false
  # Prevent Iron Golems from spawning naturally via village defense
  prevent-iron-golem-spawn: false
  # Group adjacent chunks together when evaluating spawn limits
  group-chunks: true
  # 1 = 1x1 (1 chunk), 2 = 3x3 (9 chunks), 3 = 5x5 (25 chunks)
  group-chunks-radius: 2

# When true, existing entities above the limit are removed (oldest first);
# when false, only new spawns/placements above the limit are cancelled.
remove-existing: true

# Chunks excluded from entity checks (format: "worldName:chunkX:chunkZ")
excluded-chunks: []

auto-clean:
  # Periodically check chunks around online players for overcrowded farms
  use: true
  # Notify players with obsidian.mobfarm.cleaninform when entities are cleaned
  inform: true
  # Check interval in seconds (clamped 15..3600)
  interval-seconds: 30
  # Maximum entities removed per cycle per location (0 or <= 0 uses 500)
  max-removed: 500
  # Group chunks when running auto-clean
  group-chunks: false
  # Radius (1..3) when group-chunks is enabled
  chunk-radius: 2
  # Radius (1..2) around online players when group-chunks is disabled
  expand-range: 2

commands:
  clean:
    max-removed: 500
    group-chunks: false
    group-chunks-radius: 1
  exclude-disabled-from-list: false

ignore:
  full-armor-stands: true
  entity-with-picked-item: true
  full-item-frames: true
  tamed-animals: true
  named-animals: true
  with-saddle: true
  baby-animals: true
  worlds:
    - "Test"

wolf-control:
  # Automatically make excess standing tamed wolves sit when above max per owner
  enabled: false
  max: 3

hopper-control:
  # Dynamically throttle active hoppers by adjusting transfer cooldown (Paper native API)
  enabled: false
  default-cooldown: 8
  slowest-rate: 40
  adjust-every: 30

redstone:
  # Track redstone pulse activity per chunk over a sliding window (default 60s)
  track: false
  window-seconds: 60

block-types:
  # Limit specific block types per chunk (bypassable with obsidian.mobfarm.bypasslimit.<material>)
  limit: false
  # Check pistons pushing/pulling limited blocks across chunk boundaries
  check-piston-move: true
  list:
    HOPPER: 10
    PISTON: 10
    STICKY_PISTON: 10
    OBSERVER: 10

log:
  enabled: false
  from: 5
  folder: "logs/mobfarm"


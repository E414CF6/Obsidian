name: Obsidian
version: '${version}'
main: obsidian.ObsidianPlugin
api-version: '26.3'
folia-supported: true
load: POSTWORLD
softdepend: [ Vault, PlaceholderAPI, LuckPerms ]
description: Modern Essentials

permissions:
  obsidian.admin:
    description: Grants access to administrative Obsidian commands
    default: op
  obsidian.command:
    description: Grants access to base /obsidian command
    default: true
  obsidian.teleport.safe:
    description: Automatically adjusts unsafe teleport destinations to safe locations
    default: true
  obsidian.command.home.showlist:
    description: Grants access to list/GUI homes
    default: true
  obsidian.command.warp.showlist:
    description: Grants access to list/GUI warps
    default: true
  obsidian.sethome.unlimited:
    description: Allows unlimited homes
    default: op
  obsidian.vanish.see:
    description: Allows seeing vanished players
    default: op
  obsidian.chat.color:
    description: Allows color/MiniMessage codes in chat
    default: op
  obsidian.chat.bypassfilter:
    description: Bypasses chat anti-spam, caps, and word filters
    default: op
  obsidian.staffchat:
    description: Access to staff chat (/staffmsg)
    default: op
  obsidian.socialspy:
    description: Access to private message monitoring (/socialspy)
    default: op
  obsidian.protect.co:
    description: Grants access to /co base command
    default: op
  obsidian.protect.inspect:
    description: Grants access to /co inspect
    default: op
  obsidian.protect.lookup:
    description: Grants access to /co lookup, /co near, and /co page
    default: op
  obsidian.protect.rollback:
    description: Grants access to /co rollback, /co apply, /co cancel, and /co undo
    default: op
  obsidian.protect.restore:
    description: Grants access to /co restore
    default: op
  obsidian.protect.purge:
    description: Grants access to /co purge
    default: op
  obsidian.protect.status:
    description: Grants access to /co status
    default: op
  obsidian.protect.consumer:
    description: Grants access to /co consumer
    default: op
  obsidian.protect.teleport:
    description: Grants access to /co teleport
    default: op
  obsidian.protect.reload:
    description: Grants access to /co reload
    default: op
  obsidian.protect.*:
    description: Grants access to all Obsidian Protect permissions
    default: op
    children:
      obsidian.protect.co: true
      obsidian.protect.inspect: true
      obsidian.protect.lookup: true
      obsidian.protect.rollback: true
      obsidian.protect.restore: true
      obsidian.protect.purge: true
      obsidian.protect.status: true
      obsidian.protect.consumer: true
      obsidian.protect.teleport: true
      obsidian.protect.reload: true
  obsidian.stats.admin:
    description: Grants access to /serve and /stats web API management commands
    default: op
  obsidian.mobfarm.command:
    description: Grants access to /mfm base command
    default: op
  obsidian.mobfarm.command.clean:
    description: Grants access to /mfm clean and /mobclean
    default: op
  obsidian.mobfarm.command.list:
    description: Grants access to /mfm list and /mobreport
    default: op
  obsidian.mobfarm.command.limits:
    description: Grants access to /mfm limits
    default: op
  obsidian.mobfarm.command.limits.full:
    description: Shows exact entity counts and limits in /mfm limits
    default: op
  obsidian.mobfarm.command.hoppers:
    description: Grants access to /mfm hoppers
    default: op
  obsidian.mobfarm.command.redstone:
    description: Grants access to /mfm redstone
    default: op
  obsidian.mobfarm.command.reload:
    description: Grants access to /mfm reload
    default: op
  obsidian.mobfarm.cleaninform:
    description: Receives automatic mob farm cleanup summaries
    default: op
  obsidian.mobfarm.bypasslimit.*:
    description: Bypasses per-chunk block and entity placement limits
    default: op
  obsidian.mobfarm.build.*:
    description: Allows building Iron Golems, Snow Golems, and Withers when restricted
    default: op
  obsidian.mobfarm.*:
    description: Grants access to all Obsidian MobFarm permissions
    default: op
    children:
      obsidian.mobfarm.command: true
      obsidian.mobfarm.command.clean: true
      obsidian.mobfarm.command.list: true
      obsidian.mobfarm.command.limits: true
      obsidian.mobfarm.command.limits.full: true
      obsidian.mobfarm.command.hoppers: true
      obsidian.mobfarm.command.redstone: true
      obsidian.mobfarm.command.reload: true
      obsidian.mobfarm.cleaninform: true
      obsidian.mobfarm.bypasslimit.*: true
      obsidian.mobfarm.build.*: true
      obsidian.command.mobclean: true
      obsidian.command.mobreport: true
